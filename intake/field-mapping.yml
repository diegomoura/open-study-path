version: 4
spec_id: open-study-path-intake

github_issue:
  current_form_version: 4
  current_mappings:
    issue_title: path.name

mappings:
  path_name: path.name
  subject: path.learning_request
  objective: path.objective
  desired_outcome: path.desired_outcome
  motivation: path.motivation
  time_constraints: path.time_constraints
  current_level: learner.current_level
  prior_knowledge: learner.prior_knowledge
  preferred_language: learner.preferred_language
  learning_formats: preferences.formats
  theory_practice_balance: preferences.theory_practice_balance
  assessment_style: preferences.assessment_style
  accessibility_needs: learner.accessibility_needs
  reference_text_or_urls: references.text_or_urls
  reference_attachments: references.attachments
  integration_experience: integration_preferences.experience
  already_uses: integration_preferences.already_uses
  willing_to_connect: integration_preferences.willing_to_connect
  integration_constraints: integration_preferences.notes
  task_manager: integrations.task_manager.provider
  todoist_reminders: integrations.reminders.enabled
  email_summaries: integrations.notifications.provider
  additional_notes: preferences.notes

derived_fields:
  path.subject:
    from: path.learning_request
    strategy: concise_topic_label
    max_length: 120

provider_rules:
  preferred_language:
    pt-br:
      learner.preferred_language: pt-BR
    "português (brasil)":
      learner.preferred_language: pt-BR
    en:
      learner.preferred_language: en
    english:
      learner.preferred_language: en

  integration_experience:
    guided_recommendations:
      integration_preferences.experience: guided_recommendations
      integration_preferences.account_connections: ask_per_provider
    "quero sugestões de ferramentas quando forem úteis":
      integration_preferences.experience: guided_recommendations
      integration_preferences.account_connections: ask_per_provider
    minimal:
      integration_preferences.experience: minimal
      integration_preferences.account_connections: ask_per_provider
    "quero algo simples, principalmente no github":
      integration_preferences.experience: minimal
      integration_preferences.account_connections: ask_per_provider
    enriched:
      integration_preferences.experience: enriched
      integration_preferences.account_connections: ask_per_provider
    "quero uma experiência mais interativa com ferramentas externas":
      integration_preferences.experience: enriched
      integration_preferences.account_connections: ask_per_provider
    no_external_accounts:
      integration_preferences.experience: minimal
      integration_preferences.account_connections: no_external_accounts
    "não quero sugestões que exijam conectar outras contas":
      integration_preferences.experience: minimal
      integration_preferences.account_connections: no_external_accounts

  todoist_reminders:
    auto:
      integrations.reminders.provider: auto
      integrations.reminders.enabled: auto
    enabled:
      integrations.reminders.provider: todoist
      integrations.reminders.enabled: enabled
    disabled:
      integrations.reminders.provider: none
      integrations.reminders.enabled: disabled

  email_summaries:
    none:
      integrations.notifications.provider: chat
      integrations.notifications.email_enabled: false
    gmail:
      integrations.notifications.provider: gmail
      integrations.notifications.email_enabled: true
    outlook_email:
      integrations.notifications.provider: outlook_email
      integrations.notifications.email_enabled: true

normalization:
  trim_strings: true
  discard_empty_optional_fields: true
  split_multiline_prior_knowledge: true
  preserve_auto_provider_choices: true
  attachments:
    persist_original_files: false
    persist_safe_metadata_only: true
  personal_data:
    discard_unnecessary_identifiers: true
  assumptions:
    record_in: state/intake-summary.json
