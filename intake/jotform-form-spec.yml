version: 2
id: open-study-path-intake

form:
  title_template: "Open Study Path — {repository}"
  default_language: pt-BR
  workspace_type: personal
  description: >-
    Formulário de onboarding para gerar uma trilha de aprendizagem personalizada.
    As respostas serão normalizadas no repositório da instância. Integrações são
    opcionais e serão recomendadas somente depois do diagnóstico. GitHub permanece
    como fonte de verdade do conteúdo, avaliações e domínio. Não informe segredos
    ou dados pessoais desnecessários.
  completion_message: >-
    Formulário enviado. Volte ao ChatGPT conectado ao seu repositório e peça
    para importar a submissão mais recente. O envio não gera a trilha automaticamente.

privacy:
  persist_raw_submission: false
  attachments_optional: true
  persist_uploaded_files: false
  normalized_data_requires_consent: true

sections:
  - id: goal
    title: Objetivo
  - id: context
    title: Contexto atual
  - id: availability
    title: Disponibilidade
  - id: preferences
    title: Preferências de aprendizagem
  - id: integrations
    title: Integrações opcionais
    description: >-
      O agente analisará a trilha e recomendará somente ferramentas úteis. Para cada
      recomendação, explicará finalidade, uso, limites gratuitos, dados, fallback e
      autoridade. Nenhuma integração opcional bloqueará o curso.
  - id: consent
    title: Consentimento

fields:
  - key: path_name
    section: goal
    label: Nome da trilha
    type: short_text
    required: false

  - key: subject
    section: goal
    label: O que você quer aprender?
    type: short_text
    required: true

  - key: objective
    section: goal
    label: Descreva detalhadamente seu objetivo
    type: long_text
    required: true

  - key: desired_outcome
    section: goal
    label: Qual resultado concreto gostaria de alcançar?
    type: long_text
    required: false

  - key: motivation
    section: goal
    label: Por que deseja estudar isso?
    type: long_text
    required: false

  - key: current_level
    section: context
    label: Qual é seu nível atual?
    type: single_choice
    required: true
    options: [none, beginner, intermediate, advanced]

  - key: prior_knowledge
    section: context
    label: Quais conhecimentos ou experiências anteriores são relevantes?
    type: long_text
    required: false

  - key: reference_text_or_urls
    section: context
    label: Cole textos ou URLs de referência
    type: long_text
    required: false

  - key: reference_attachments
    section: context
    label: Anexe arquivos de referência
    help_text: >-
      Anexos são opcionais. Exemplos: vaga, currículo, PDF, ementa, imagem ou texto.
    type: file_upload
    required: false
    multiple: true

  - key: preferred_language
    section: preferences
    label: Em qual idioma deseja receber o conteúdo?
    type: short_text
    required: true
    default: pt-BR

  - key: weekly_hours
    section: availability
    label: Quantas horas por semana você possui?
    type: number
    required: true
    validation:
      minimum: 1

  - key: deadline
    section: availability
    label: Existe uma data limite?
    type: date
    required: false

  - key: preferred_days
    section: availability
    label: Quais dias prefere estudar?
    type: multi_choice
    required: false
    options: [monday, tuesday, wednesday, thursday, friday, saturday, sunday]

  - key: preferred_periods
    section: availability
    label: Quais períodos prefere?
    type: multi_choice
    required: false
    options: [morning, afternoon, evening]

  - key: learning_formats
    section: preferences
    label: Quais formatos de aprendizagem prefere?
    type: multi_choice
    required: false
    options: [documentation, books, videos, courses, exercises, projects, discussions, flashcards]

  - key: theory_practice_balance
    section: preferences
    label: Qual equilíbrio prefere entre teoria e prática?
    type: single_choice
    required: false
    options: [theory, balanced, practical]

  - key: assessment_style
    section: preferences
    label: Como prefere ser avaliado?
    help_text: A evidência oficial continuará registrada nas avaliações do GitHub.
    type: multi_choice
    required: false
    options: [quizzes, exercises, written_explanation, project, mock_interview]

  - key: accessibility_needs
    section: preferences
    label: Há alguma necessidade de acessibilidade ou restrição?
    type: long_text
    required: false

  - key: integration_experience
    section: integrations
    label: Quanto enriquecimento externo você deseja?
    help_text: >-
      minimal usa principalmente GitHub e Markdown; guided_recommendations recomenda
      somente o que for útil; enriched considera mais recursos opcionais.
    type: single_choice
    required: true
    default: guided_recommendations
    options: [minimal, guided_recommendations, enriched]

  - key: free_tier_only
    section: integrations
    label: O curso deve funcionar apenas com recursos gratuitos?
    help_text: Recursos pagos nunca serão obrigatórios sem alternativa gratuita.
    type: yes_no
    required: true
    default: true

  - key: account_connections
    section: integrations
    label: Como deseja tratar novas conexões de conta?
    type: single_choice
    required: true
    default: ask_per_provider
    options: [ask_per_provider, connected_services_only, no_external_accounts]

  - key: already_uses
    section: integrations
    label: Quais serviços você já utiliza?
    help_text: >-
      Trello organiza tópicos visualmente; Todoist oferece tarefas simples e recorrentes;
      Reclaim protege tempo de foco; Quizlet cria flashcards; Consensus pesquisa literatura;
      Habitify mede consistência; Whimsical cria diagramas externos; Drive guarda entregáveis;
      Airtable mostra dashboards derivados e nunca substitui o GitHub.
    type: multi_choice
    required: false
    options:
      - trello
      - todoist
      - google_calendar
      - outlook_calendar
      - reclaim
      - quizlet
      - consensus
      - habitify
      - whimsical
      - google_drive
      - airtable
      - notion

  - key: willing_to_connect
    section: integrations
    label: Quais capacidades aceitaria conectar se forem recomendadas?
    help_text: Marcar não conecta nada automaticamente.
    type: multi_choice
    required: false
    options:
      - task_management
      - scheduling
      - flashcards
      - academic_research
      - habit_tracking
      - external_diagrams
      - artifact_workspace
      - analytics_dashboard
      - course_discovery

  - key: task_manager
    section: integrations
    label: Onde prefere acompanhar as tarefas?
    help_text: >-
      Trello é o padrão para cursos ricos; Todoist é adequado para uma experiência
      simples. Apenas um backend manterá o estado operacional autoritativo.
    type: single_choice
    required: true
    default: auto
    options: [auto, trello, todoist, github_issues, markdown]

  - key: scheduling_provider
    section: integrations
    label: Como prefere planejar as sessões de estudo?
    help_text: >-
      Reclaim é preferido para agenda adaptativa; Google ou Outlook oferecem blocos
      fixos. A trilha nunca exigirá assinatura paga.
    type: single_choice
    required: true
    default: auto
    options: [auto, reclaim, google_calendar, outlook_calendar, none]

  - key: todoist_reminders
    section: integrations
    label: Deseja considerar Todoist apenas para lembretes recorrentes?
    help_text: Concluir um lembrete não conclui o tópico no backend principal.
    type: single_choice
    required: false
    default: auto
    options: [auto, enabled, disabled]

  - key: email_summaries
    section: integrations
    label: Deseja receber resumos por e-mail quando houver provedor compatível?
    type: single_choice
    required: false
    default: none
    options: [none, gmail, outlook_email]

  - key: integration_notes
    section: integrations
    label: Restrições ou preferências sobre integrações
    type: long_text
    required: false

  - key: additional_notes
    section: preferences
    label: Observações adicionais
    type: long_text
    required: false

  - key: consent
    section: consent
    label: Consentimento
    type: checkbox
    required: true
    text: >-
      Entendo que informações normalizadas necessárias ao planejamento poderão
      ser salvas no meu repositório, sem persistir a submissão bruta, anexos
      originais, credenciais ou dados pessoais desnecessários.
