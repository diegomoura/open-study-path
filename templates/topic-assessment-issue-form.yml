name: Avaliação TOPIC-000 — Replace me
description: Envie as evidências e respostas para avaliação deste tópico.
title: "[Avaliação] TOPIC-000 — Replace me"
labels:
  - assessment
  - assessment:submitted
body:
  - type: markdown
    attributes:
      value: |
        <!-- open-study-path:assessment topic_id=TOPIC-000 version=1 -->
        O título já vem preenchido com o tópico completo; não é necessário editá-lo.

        Responda com suas próprias palavras. O objetivo é demonstrar compreensão e aplicação, não apenas reproduzir definições.

        Depois de enviar, retorne ao chat com: `Finalizei o TOPIC-000. Avalie minhas respostas.`
        Você não precisa copiar o número da issue, exceto quando houver mais de uma submissão candidata.

  - type: input
    id: evidence
    attributes:
      label: Link ou referência da evidência
      description: Inclua o link do arquivo, comentário, documento ou cartão quando houver.
      placeholder: https://...
    validations:
      required: false

  - type: textarea
    id: q1
    attributes:
      label: Questão 1 — compreensão conceitual
      description: Substitua por uma pergunta específica do tópico.
      placeholder: Escreva sua resposta e justifique.
    validations:
      required: true

  - type: textarea
    id: q2
    attributes:
      label: Questão 2 — análise
      description: Substitua por uma tarefa de classificação ou comparação.
    validations:
      required: true

  - type: textarea
    id: q3
    attributes:
      label: Questão 3 — aplicação
      description: Substitua por um cenário novo que exija uma decisão ou solução.
    validations:
      required: true

  - type: textarea
    id: q4
    attributes:
      label: Questão 4 — erro comum
      description: Substitua por uma afirmação equivocada que o estudante deve analisar e corrigir.
    validations:
      required: true

  - type: textarea
    id: q5
    attributes:
      label: Questão 5 — evidência e reflexão
      description: Peça uma evidência concreta e uma autoavaliação pelos critérios de domínio.
    validations:
      required: true

  - type: checkboxes
    id: confirmation
    attributes:
      label: Confirmação
      options:
        - label: As respostas representam meu raciocínio e estão prontas para avaliação.
          required: true
