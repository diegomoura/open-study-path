name: Patch static SVG PDF renderer

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-renderer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Separate tool root from course root
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/render_study_slides.mjs')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              'import { promises as fs } from "node:fs";',
              'import { promises as fs, readFileSync } from "node:fs";',
          )
          text = text.replace(
              'import path from "node:path";',
              'import path from "node:path";\nimport { fileURLToPath } from "node:url";',
          )
          old = '''const execFileAsync = promisify(execFile);
          const require = createRequire(import.meta.url);
          const PUPPETEER_VERSION = require("puppeteer/package.json").version;
          const MERMAID_CLI_VERSION = require("@mermaid-js/mermaid-cli/package.json").version;
          const PDF_LIB_VERSION = require("pdf-lib/package.json").version;'''
          new = '''const execFileAsync = promisify(execFile);
          const require = createRequire(import.meta.url);
          const TOOL_ROOT = path.resolve(path.dirname(fileURLToPath(import.meta.url)), "..");

          function installedPackageVersion(...segments) {
            const packageJson = path.join(TOOL_ROOT, "node_modules", ...segments, "package.json");
            return JSON.parse(readFileSync(packageJson, "utf8")).version;
          }

          const PUPPETEER_VERSION = installedPackageVersion("puppeteer");
          const MERMAID_CLI_VERSION = installedPackageVersion("@mermaid-js", "mermaid-cli");
          const PDF_LIB_VERSION = installedPackageVersion("pdf-lib");'''
          if old not in text and 'const TOOL_ROOT =' not in text:
              raise SystemExit('renderer header pattern not found')
          text = text.replace(old, new)
          text = text.replace(
              'const mmdc = path.join(root, "node_modules", ".bin", process.platform === "win32" ? "mmdc.cmd" : "mmdc");',
              'const mmdc = path.join(TOOL_ROOT, "node_modules", ".bin", process.platform === "win32" ? "mmdc.cmd" : "mmdc");',
          )
          path.write_text(text, encoding='utf-8')
          PY
          node --check scripts/render_study_slides.mjs
      - name: Publish renderer correction
        run: |
          if git diff --quiet -- scripts/render_study_slides.mjs; then
            echo "Renderer already corrected."
            exit 0
          fi
          git config user.name open-study-path-bot
          git config user.email open-study-path-bot@users.noreply.github.com
          git add scripts/render_study_slides.mjs
          git commit -m "Corrigir resolução das ferramentas do renderer"
          git push origin HEAD:${{ github.head_ref || github.ref_name }}
