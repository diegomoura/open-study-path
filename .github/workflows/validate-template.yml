name: Patch deterministic slide snapshot

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-renderer:
    if: github.head_ref == 'agent/static-svg-pdf-slides-v3' || github.ref_name == 'agent/static-svg-pdf-slides-v3'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/static-svg-pdf-slides-v3
          fetch-depth: 0
      - name: Embed SVGs in deterministic snapshot
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/render_study_slides.mjs')
          text = path.read_text(encoding='utf-8')
          old = '''async function snapshotDeck(page) {
            return page.evaluate(() => ({
              styles: Array.from(document.styleSheets).flatMap((sheet) => { try { return Array.from(sheet.cssRules, (rule) => rule.cssText); } catch { return []; } }).join("\\n"),
              slides: Array.from(document.querySelectorAll(".osp-slide"), (slide) => slide.outerHTML),
            }));
          }
'''
          new = '''async function snapshotDeck(page) {
            return page.evaluate(async () => ({
              styles: Array.from(document.styleSheets).flatMap((sheet) => { try { return Array.from(sheet.cssRules, (rule) => rule.cssText); } catch { return []; } }).join("\\n"),
              slides: await Promise.all(Array.from(document.querySelectorAll(".osp-slide"), async (slide) => {
                const clone = slide.cloneNode(true);
                const originalImages = Array.from(slide.querySelectorAll("img"));
                const clonedImages = Array.from(clone.querySelectorAll("img"));
                for (let index = 0; index < clonedImages.length; index += 1) {
                  const response = await fetch(originalImages[index].src);
                  if (!response.ok) throw new Error(`Could not load slide image: ${originalImages[index].src}`);
                  const svg = await response.text();
                  clonedImages[index].setAttribute("src", `data:image/svg+xml;charset=utf-8,${encodeURIComponent(svg)}`);
                }
                return clone.outerHTML;
              })),
            }));
          }
'''
          if old not in text:
              if 'data:image/svg+xml;charset=utf-8' in text:
                  raise SystemExit(0)
              raise SystemExit('snapshotDeck marker not found')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          node --check scripts/render_study_slides.mjs
          if git diff --quiet -- scripts/render_study_slides.mjs; then
            echo 'Renderer already patched.'
            exit 0
          fi
          git config user.name open-study-path-bot
          git config user.email open-study-path-bot@users.noreply.github.com
          git add scripts/render_study_slides.mjs
          git commit -m 'Tornar snapshot de SVG determinístico'
          git push origin HEAD:agent/static-svg-pdf-slides-v3
