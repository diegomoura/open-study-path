name: Validate template

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: python -m pip install --quiet --disable-pip-version-check pyyaml jsonschema

      - name: Parse template marker YAML
        run: python -c "import yaml; yaml.safe_load(open('.open-study-path/template.yml', encoding='utf-8'))"

      - name: Parse GitHub Issue Form YAML
        run: python -c "import yaml; yaml.safe_load(open('.github/ISSUE_TEMPLATE/create-study-path.yml', encoding='utf-8'))"

      - name: Parse lifecycle manifest YAML
        run: python -c "import yaml; yaml.safe_load(open('instructions/manifest.yml', encoding='utf-8'))"

      - name: Parse Jotform specification YAML
        run: python -c "import yaml; yaml.safe_load(open('intake/jotform-form-spec.yml', encoding='utf-8'))"

      - name: Parse field mapping YAML
        run: python -c "import yaml; yaml.safe_load(open('intake/field-mapping.yml', encoding='utf-8'))"

      - name: Parse configuration example YAML
        run: python -c "import yaml; yaml.safe_load(open('study.config.example.yml', encoding='utf-8'))"

      - name: Parse instance marker template YAML
        run: python -c "import yaml; yaml.safe_load(open('templates/instance.yml', encoding='utf-8'))"

      - name: Validate canonical template guard
        run: python scripts/validate_template.py guard

      - name: Validate intake contract
        run: python scripts/validate_template.py intake

      - name: Validate configuration schema
        run: python scripts/validate_template.py schema
