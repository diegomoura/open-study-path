name: Validate Open Study Path

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap-static-svg-pdf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Install bootstrap validation dependencies
        run: python -m pip install --quiet --disable-pip-version-check pyyaml pypdf
      - name: Build canonical static SVG/PDF contract
        run: python scripts/bootstrap_static_svg_contract.py
      - name: Upload reconstructed canonical tree
        uses: actions/upload-artifact@v4
        with:
          name: open-study-path-static-svg-final-tree
          path: |
            /tmp/open-study-path-final-tree.tar.gz
            /tmp/open-study-path-final-tree.changed-files
          if-no-files-found: error
          retention-days: 1
