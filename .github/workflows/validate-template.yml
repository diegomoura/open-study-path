name: Validate Open Study Path

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: python -m pip install --quiet --disable-pip-version-check pyyaml jsonschema

      - name: Parse repository YAML contracts
        run: python scripts/validate_template.py yaml

      - name: Validate repository mode guard
        run: python scripts/validate_template.py guard

      - name: Validate intake contract
        run: python scripts/validate_template.py intake

      - name: Validate configuration schema
        run: python scripts/validate_template.py schema

      - name: Validate guided lifecycle
        run: python scripts/validate_guided_lifecycle.py 2>&1 | tee guided-validation.log

      - name: Upload guided validation diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: guided-validation-diagnostics
          path: guided-validation.log
          if-no-files-found: ignore

      - name: Validate curriculum contract
        run: python scripts/validate_curriculum.py
