name: Validate Open Study Path

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  bootstrap-static-svg-pdf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Install bootstrap validation dependencies
        run: python -m pip install --quiet --disable-pip-version-check pyyaml pypdf
      - name: Build and commit canonical static SVG/PDF contract
        env:
          GH_TOKEN: ${{ github.token }}
          BOOTSTRAP_BRANCH: ${{ github.head_ref || github.ref_name }}
          BOOTSTRAP_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python scripts/bootstrap_static_svg_contract.py
