name: Retry publication audit

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/retry-publication-audit.yml'
      - '.open-study-path/audit/**'

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'agent/audit-publication-contracts'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/audit-publication-contracts
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet --disable-pip-version-check pyyaml
      - name: Apply audited patch
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/apply-publication-audit-fixes.yml').read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          start = source.index(marker) + len(marker)
          end = source.index("\n          PY\n", start)
          lines = source[start:end].splitlines()
          script = "\n".join(line[10:] if line.startswith("          ") else line for line in lines)
          Path('/tmp/apply_publication_audit.py').write_text(script + "\n", encoding='utf-8')
          PY
          python /tmp/apply_publication_audit.py
          cp .open-study-path/audit/refresh_review_fingerprints.py scripts/refresh_review_fingerprints.py
          sed -i 's/parents\[3\]/parents[1]/' scripts/refresh_review_fingerprints.py
          cp scripts/refresh_review_fingerprints.py .open-study-path/audit/refresh_review_fingerprints.py
          cp .open-study-path/audit/test_refresh_review_fingerprints.py tests/test_refresh_review_fingerprints.py
          sed -i 's/parents\[3\]/parents[1]/' tests/test_refresh_review_fingerprints.py
      - name: Run focused regression tests
        run: |
          python scripts/test_review_framework.py
          python -m unittest tests/test_refresh_review_fingerprints.py
          python -m unittest tests/test_validate_task_projection.py tests/test_pedagogical_content_hash.py
          python scripts/validate_task_projection.py
          python scripts/validate_review_framework.py
      - name: Publish consolidated commit
        run: |
          rm -rf .open-study-path/audit
          rm .github/workflows/apply-publication-audit-fixes.yml
          rm .github/workflows/run-publication-audit-fixes.yml
          rm .github/workflows/retry-publication-audit.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Corrigir rastreabilidade da publicação e revisões históricas"
          git push origin HEAD:agent/audit-publication-contracts
