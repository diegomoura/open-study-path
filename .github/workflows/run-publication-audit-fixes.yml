name: Run publication audit fixes

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/apply-publication-audit-fixes.yml'
      - '.github/workflows/run-publication-audit-fixes.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'agent/audit-publication-contracts'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/audit-publication-contracts
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install --quiet --disable-pip-version-check pyyaml
      - name: Extract and apply the audited patch
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/apply-publication-audit-fixes.yml').read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          start = source.index(marker) + len(marker)
          end = source.index("\n          PY\n", start)
          lines = source[start:end].splitlines()
          script = "\n".join(line[10:] if line.startswith("          ") else line for line in lines)
          Path('/tmp/apply_publication_audit.py').write_text(script + "\n", encoding='utf-8')
          PY
          python /tmp/apply_publication_audit.py
          cp .open-study-path/audit/refresh_review_fingerprints.py scripts/refresh_review_fingerprints.py
          sed -i 's/parents\[3\]/parents[1]/' scripts/refresh_review_fingerprints.py
      - name: Normalize current-owner regression test
        run: |
          cat > tests/test_refresh_review_fingerprints.py <<'PY'
          import hashlib
          import subprocess
          import sys
          import tempfile
          from pathlib import Path
          import unittest
          import yaml

          SCRIPT_SOURCE = (Path(__file__).resolve().parents[1] / "scripts" / "refresh_review_fingerprints.py").read_text(encoding="utf-8")


          class RefreshReviewFingerprintsTest(unittest.TestCase):
              def prepare(self, root: Path) -> Path:
                  (root / "scripts").mkdir()
                  (root / "state" / "reviews").mkdir(parents=True)
                  script = root / "scripts" / "refresh_review_fingerprints.py"
                  script.write_text(SCRIPT_SOURCE, encoding="utf-8")
                  return script

              def review(self, root: Path, name: str, reviewed_at: str, artifacts: list[dict]) -> Path:
                  path = root / "state" / "reviews" / name
                  path.write_text(yaml.safe_dump({"status": "approved", "reviewed_at": reviewed_at, "artifacts": artifacts}, sort_keys=False), encoding="utf-8")
                  return path

              def run_script(self, root: Path, script: Path, write: bool = False):
                  command = [sys.executable, str(script)]
                  if write:
                      command.append("--write")
                  return subprocess.run(command, cwd=root, text=True, capture_output=True)

              def test_historical_review_remains_immutable(self):
                  with tempfile.TemporaryDirectory() as tmp:
                      root = Path(tmp)
                      script = self.prepare(root)
                      artifact = root / "state" / "integrations.json"
                      artifact.write_text('{"status":"current"}', encoding="utf-8")
                      old = self.review(root, "setup.yml", "2026-08-01T10:00:00Z", [{"path": "state/integrations.json", "change": "current", "sha256": "0" * 64}])
                      current_hash = hashlib.sha256(artifact.read_bytes()).hexdigest()
                      self.review(root, "publication.yml", "2026-08-03T10:00:00Z", [{"path": "state/integrations.json", "change": "current", "sha256": current_hash}])
                      result = self.run_script(root, script)
                      self.assertEqual(0, result.returncode, result.stderr)
                      self.assertEqual("0" * 64, yaml.safe_load(old.read_text(encoding="utf-8"))["artifacts"][0]["sha256"])

              def test_write_refreshes_only_latest_owner(self):
                  with tempfile.TemporaryDirectory() as tmp:
                      root = Path(tmp)
                      script = self.prepare(root)
                      (root / "study").mkdir()
                      artifact = root / "study" / "a.md"
                      artifact.write_text("current", encoding="utf-8")
                      old = self.review(root, "old.yml", "2026-08-01T10:00:00Z", [{"path": "study/a.md", "change": "current", "sha256": "0" * 64}])
                      latest = self.review(root, "latest.yml", "2026-08-03T10:00:00Z", [{"path": "study/a.md", "change": "current", "sha256": "1" * 64}])
                      result = self.run_script(root, script, write=True)
                      self.assertEqual(0, result.returncode, result.stderr)
                      self.assertEqual("0" * 64, yaml.safe_load(old.read_text(encoding="utf-8"))["artifacts"][0]["sha256"])
                      self.assertEqual(hashlib.sha256(b"current").hexdigest(), yaml.safe_load(latest.read_text(encoding="utf-8"))["artifacts"][0]["sha256"])

              def test_equal_review_times_are_ambiguous(self):
                  with tempfile.TemporaryDirectory() as tmp:
                      root = Path(tmp)
                      script = self.prepare(root)
                      (root / "study").mkdir()
                      (root / "study" / "a.md").write_text("A", encoding="utf-8")
                      self.review(root, "one.yml", "2026-08-03T10:00:00Z", [{"path": "study/a.md", "change": "current", "sha256": "0" * 64}])
                      self.review(root, "two.yml", "2026-08-03T10:00:00Z", [{"path": "study/a.md", "change": "current", "sha256": "1" * 64}])
                      result = self.run_script(root, script)
                      self.assertNotEqual(0, result.returncode)
                      self.assertIn("ambiguous current review owner", result.stderr)


          if __name__ == "__main__":
              unittest.main()
          PY
      - name: Run focused regression tests
        run: |
          python scripts/test_review_framework.py
          python -m unittest tests/test_refresh_review_fingerprints.py
          python -m unittest tests/test_validate_task_projection.py tests/test_pedagogical_content_hash.py
          python scripts/validate_task_projection.py
          python scripts/validate_review_framework.py
      - name: Publish one consolidated commit
        run: |
          rm -rf .open-study-path/audit
          rm .github/workflows/apply-publication-audit-fixes.yml
          rm .github/workflows/retry-publication-audit.yml
          rm .github/workflows/run-publication-audit-fixes.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Corrigir rastreabilidade da publicação e revisões históricas"
          git push origin HEAD:agent/audit-publication-contracts
