name: Apply publication audit fixes

on:
  push:
    branches: [agent/audit-publication-contracts]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/audit-publication-contracts
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install --quiet --disable-pip-version-check pyyaml
      - name: Apply audited fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          ROOT = Path('.')

          def replace_once(path: str, old: str, new: str) -> None:
              target = ROOT / path
              text = target.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'expected text not found in {path}: {old[:80]!r}')
              target.write_text(text.replace(old, new, 1), encoding='utf-8')

          (ROOT / 'scripts/refresh_review_fingerprints.py').write_text(r'''#!/usr/bin/env python3
"""Validate or refresh only the latest approved review owner of each artifact."""
from __future__ import annotations

import argparse
from dataclasses import dataclass
from datetime import datetime, timezone
import hashlib
from pathlib import Path
import sys
from typing import Any

import yaml

ROOT = Path(__file__).resolve().parents[1]
REVIEWS = ROOT / "state" / "reviews"


@dataclass
class ReviewEntry:
    manifest: Path
    reviewed_at: datetime
    artifact: dict[str, Any]


def digest(path: Path) -> str:
    return hashlib.sha256(path.read_bytes()).hexdigest()


def parse_reviewed_at(value: Any, manifest: Path) -> datetime:
    if not isinstance(value, str) or not value.strip():
        raise ValueError(f"{manifest.relative_to(ROOT)} is missing reviewed_at")
    normalized = value.strip().replace("Z", "+00:00")
    try:
        parsed = datetime.fromisoformat(normalized)
    except ValueError as exc:
        raise ValueError(
            f"{manifest.relative_to(ROOT)} has invalid reviewed_at: {value}"
        ) from exc
    if parsed.tzinfo is None:
        parsed = parsed.replace(tzinfo=timezone.utc)
    return parsed.astimezone(timezone.utc)


def load_entries() -> tuple[dict[Path, dict[str, Any]], list[ReviewEntry], list[str]]:
    documents: dict[Path, dict[str, Any]] = {}
    entries: list[ReviewEntry] = []
    errors: list[str] = []
    if not REVIEWS.exists():
        return documents, entries, errors

    for manifest in sorted(REVIEWS.glob("*.yml")):
        try:
            data = yaml.safe_load(manifest.read_text(encoding="utf-8")) or {}
        except Exception as exc:
            errors.append(f"invalid review manifest {manifest.relative_to(ROOT)}: {exc}")
            continue
        if not isinstance(data, dict) or data.get("status") != "approved":
            continue
        try:
            reviewed_at = parse_reviewed_at(data.get("reviewed_at"), manifest)
        except ValueError as exc:
            errors.append(str(exc))
            continue
        documents[manifest] = data
        artifacts = data.get("artifacts") or []
        if not isinstance(artifacts, list):
            continue
        for artifact in artifacts:
            if not isinstance(artifact, dict):
                continue
            relative = artifact.get("path")
            change = artifact.get("change", "current")
            if not isinstance(relative, str) or change not in {"current", "deleted"}:
                continue
            entries.append(ReviewEntry(manifest, reviewed_at, artifact))
    return documents, entries, errors


def select_current_owners(entries: list[ReviewEntry]) -> tuple[dict[str, ReviewEntry], list[str]]:
    owners: dict[str, ReviewEntry] = {}
    errors: list[str] = []
    for entry in entries:
        relative = str(entry.artifact["path"])
        previous = owners.get(relative)
        if previous is None or entry.reviewed_at > previous.reviewed_at:
            owners[relative] = entry
            continue
        if entry.reviewed_at == previous.reviewed_at and entry.manifest != previous.manifest:
            errors.append(
                "ambiguous current review owner for "
                f"{relative}: {previous.manifest.relative_to(ROOT)} and "
                f"{entry.manifest.relative_to(ROOT)} share reviewed_at"
            )
    return owners, errors


def validate_or_refresh(write: bool) -> tuple[int, int, list[str]]:
    documents, entries, errors = load_entries()
    owners, owner_errors = select_current_owners(entries)
    errors.extend(owner_errors)
    stale = 0
    changed_manifests: set[Path] = set()

    for relative, entry in sorted(owners.items()):
        target = (ROOT / relative).resolve()
        try:
            target.relative_to(ROOT.resolve())
        except ValueError:
            errors.append(f"unsafe reviewed artifact path: {relative}")
            continue

        change = entry.artifact.get("change", "current")
        label = entry.manifest.relative_to(ROOT)
        if change == "deleted":
            if target.exists():
                stale += 1
                errors.append(f"{label} is the latest owner of {relative} as deleted, but the file exists")
            continue

        if not target.is_file():
            stale += 1
            errors.append(f"{label} is the latest owner of missing artifact: {relative}")
            continue

        recorded = entry.artifact.get("sha256")
        current = digest(target)
        if recorded == current:
            continue

        stale += 1
        print(f"STALE CURRENT OWNER {label}: {relative}: {recorded} -> {current}")
        if write:
            entry.artifact["sha256"] = current
            changed_manifests.add(entry.manifest)

    if write:
        for manifest in sorted(changed_manifests):
            manifest.write_text(
                yaml.safe_dump(documents[manifest], sort_keys=False, allow_unicode=True),
                encoding="utf-8",
            )
    return stale, len(changed_manifests), errors


def main() -> int:
    parser = argparse.ArgumentParser()
    parser.add_argument(
        "--write",
        action="store_true",
        help="refresh only the latest approved review owner for each current artifact",
    )
    args = parser.parse_args()

    stale, changed, errors = validate_or_refresh(args.write)
    for error in errors:
        print(f"ERROR: {error}", file=sys.stderr)

    if args.write:
        print(f"Refreshed {changed} current-owner review manifest(s).")
        return 1 if errors else 0
    if stale or errors:
        print(
            "ERROR: current review ownership is stale; create or refresh the latest operation review",
            file=sys.stderr,
        )
        return 1
    print("Current review ownership is consistent; historical reviews remain immutable.")
    return 0


if __name__ == "__main__":
    sys.exit(main())
''', encoding='utf-8')

          (ROOT / 'tests/test_refresh_review_fingerprints.py').write_text(r'''import hashlib
import subprocess
import sys
import tempfile
from pathlib import Path
import unittest

import yaml


class RefreshReviewFingerprintsTest(unittest.TestCase):
    def setUp(self):
        self.source = (
            Path(__file__).resolve().parents[1] / "scripts" / "refresh_review_fingerprints.py"
        ).read_text(encoding="utf-8")

    def prepare(self, root: Path) -> Path:
        (root / "scripts").mkdir()
        (root / "state" / "reviews").mkdir(parents=True)
        script = root / "scripts" / "refresh_review_fingerprints.py"
        script.write_text(self.source, encoding="utf-8")
        return script

    def write_review(self, root: Path, name: str, reviewed_at: str, artifacts: list[dict]):
        path = root / "state" / "reviews" / name
        path.write_text(
            yaml.safe_dump(
                {
                    "status": "approved",
                    "reviewed_at": reviewed_at,
                    "artifacts": artifacts,
                },
                sort_keys=False,
            ),
            encoding="utf-8",
        )
        return path

    def test_refreshes_multiple_stale_entries_in_latest_review(self):
        with tempfile.TemporaryDirectory() as tmp:
            root = Path(tmp)
            script = self.prepare(root)
            (root / "study").mkdir()
            (root / "study" / "a.md").write_text("A", encoding="utf-8")
            (root / "study" / "b.md").write_text("B", encoding="utf-8")
            review = self.write_review(
                root,
                "review.yml",
                "2026-08-03T12:00:00Z",
                [
                    {"path": "study/a.md", "change": "current", "sha256": "0" * 64},
                    {"path": "study/b.md", "change": "current", "sha256": "1" * 64},
                ],
            )
            result = subprocess.run(
                [sys.executable, str(script), "--write"],
                cwd=root,
                text=True,
                capture_output=True,
            )
            self.assertEqual(result.returncode, 0, result.stderr)
            updated = yaml.safe_load(review.read_text(encoding="utf-8"))
            self.assertEqual(updated["artifacts"][0]["sha256"], hashlib.sha256(b"A").hexdigest())
            self.assertEqual(updated["artifacts"][1]["sha256"], hashlib.sha256(b"B").hexdigest())

    def test_stale_historical_review_is_not_rewritten(self):
        with tempfile.TemporaryDirectory() as tmp:
            root = Path(tmp)
            script = self.prepare(root)
            (root / "state").mkdir(exist_ok=True)
            artifact = root / "state" / "integrations.json"
            artifact.write_text('{"status":"current"}', encoding="utf-8")
            old = self.write_review(
                root,
                "setup.yml",
                "2026-08-01T10:00:00Z",
                [{"path": "state/integrations.json", "change": "current", "sha256": "0" * 64}],
            )
            current_hash = hashlib.sha256(artifact.read_bytes()).hexdigest()
            self.write_review(
                root,
                "publication.yml",
                "2026-08-03T10:00:00Z",
                [{"path": "state/integrations.json", "change": "current", "sha256": current_hash}],
            )
            result = subprocess.run(
                [sys.executable, str(script)], cwd=root, text=True, capture_output=True
            )
            self.assertEqual(result.returncode, 0, result.stderr)
            unchanged = yaml.safe_load(old.read_text(encoding="utf-8"))
            self.assertEqual(unchanged["artifacts"][0]["sha256"], "0" * 64)

    def test_write_updates_only_latest_owner(self):
        with tempfile.TemporaryDirectory() as tmp:
            root = Path(tmp)
            script = self.prepare(root)
            (root / "study").mkdir()
            artifact = root / "study" / "a.md"
            artifact.write_text("current", encoding="utf-8")
            old = self.write_review(
                root,
                "old.yml",
                "2026-08-01T10:00:00Z",
                [{"path": "study/a.md", "change": "current", "sha256": "0" * 64}],
            )
            latest = self.write_review(
                root,
                "latest.yml",
                "2026-08-03T10:00:00Z",
                [{"path": "study/a.md", "change": "current", "sha256": "1" * 64}],
            )
            result = subprocess.run(
                [sys.executable, str(script), "--write"],
                cwd=root,
                text=True,
                capture_output=True,
            )
            self.assertEqual(result.returncode, 0, result.stderr)
            self.assertEqual(
                yaml.safe_load(old.read_text(encoding="utf-8"))["artifacts"][0]["sha256"],
                "0" * 64,
            )
            self.assertEqual(
                yaml.safe_load(latest.read_text(encoding="utf-8"))["artifacts"][0]["sha256"],
                hashlib.sha256(b"current").hexdigest(),
            )


if __name__ == "__main__":
    unittest.main()
