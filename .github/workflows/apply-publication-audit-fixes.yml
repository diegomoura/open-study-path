        with tempfile.TemporaryDirectory() as temp_dir:
            path = Path(temp_dir) / "operation.json"
            path.write_text(json.dumps(operation), encoding="utf-8")
            errors = validator.validate_operation(path)
            self.assertTrue(any("duplicate topics" in error for error in errors))

    def valid_state(self):
        lists = [
            {"capability": "task_manager", "provider": "trello", "type": "list", "id": f"list-{index}", "name": name}
            for index, name in enumerate(validator.VISIBLE_LISTS, 1)
        ]
        return {
            "selected_capabilities": {
                "task_manager": {"provider": "trello", "status": "success", "resolution_status": "resolved"},
                "reminders": {"provider": "todoist", "status": "success", "resolution_status": "resolved"},
            },
            "projection": {
                "provider": "trello",
                "board_id": "board-1",
                "board_url": "https://trello.example/board-1",
                "topic_count": 2,
                "list_order": list(validator.VISIBLE_LISTS),
                "readback": {
                    "lesson_card_count": 2,
                    "managed_card_count": 3,
                    "visible_internal_marker_count": 0,
                    "verified_at": "2026-08-03T18:47:30Z",
                },
            },
            "resources": [
                {"capability": "task_manager", "provider": "trello", "type": "board", "id": "board-1", "url": "https://trello.example/board-1"},
                *lists,
                {"capability": "task_manager", "provider": "trello", "type": "orientation", "id": "orientation-1", "url": "https://trello.example/orientation", "canonical_state": "Planejado"},
                {"capability": "task_manager", "provider": "trello", "type": "card", "id": "card-1", "topic_id": "TOPIC-001", "visible_lesson_number": 1, "direct_prerequisite_ids": [], "content_version": 1, "canonical_state": "Próxima aula"},
                {"capability": "task_manager", "provider": "trello", "type": "card", "id": "card-2", "topic_id": "TOPIC-002", "visible_lesson_number": 2, "direct_prerequisite_ids": ["TOPIC-001"], "content_version": 0, "canonical_state": "Planejado"},
                {"capability": "reminders", "provider": "todoist", "type": "task", "id": "reminder-1", "target_url": "https://trello.example/board-1"},
            ],
            "resolution": {"status": "resolved"},
            "sync": {"status": "success", "last_success_at": "2026-08-03T18:47:30Z"},
        }

    def write_instance(self, root: Path, state: dict):
        (root / ".open-study-path").mkdir(parents=True)
        (root / ".open-study-path" / "instance.yml").write_text("kind: instance\n", encoding="utf-8")
        (root / "state").mkdir()
        (root / "state" / "integrations.json").write_text(json.dumps(state), encoding="utf-8")

    def test_valid_published_trello_state(self):
        with tempfile.TemporaryDirectory() as temp_dir:
            root = Path(temp_dir)
            self.write_instance(root, self.valid_state())
            self.assertEqual([], validator.validate_projection_state(root))

    def test_missing_orientation_and_list_registry_are_rejected(self):
        with tempfile.TemporaryDirectory() as temp_dir:
            root = Path(temp_dir)
            state = self.valid_state()
            state["resources"] = [
                item for item in state["resources"]
                if item.get("type") not in {"orientation", "list"}
            ]
            self.write_instance(root, state)
            errors = validator.validate_projection_state(root)
            self.assertTrue(any("seven managed lists" in error for error in errors))
            self.assertTrue(any("orientation card" in error for error in errors))

    def test_visible_marker_readback_blocks_success(self):
        with tempfile.TemporaryDirectory() as temp_dir:
            root = Path(temp_dir)
            state = self.valid_state()
            state["projection"]["readback"]["visible_internal_marker_count"] = 1
            self.write_instance(root, state)
            errors = validator.validate_projection_state(root)
            self.assertTrue(any("learner-visible internal metadata" in error for error in errors))


if __name__ == "__main__":
    unittest.main()
