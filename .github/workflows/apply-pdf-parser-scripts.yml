name: Apply PDF parser scripts

on:
  push:
    branches:
      - agent/parse-slide-pdf-metadata

permissions:
  contents: write

concurrency:
  group: apply-pdf-parser-scripts
  cancel-in-progress: true

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[pdf-parser-scripts]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout patch branch
        uses: actions/checkout@v4
        with:
          ref: agent/parse-slide-pdf-metadata
          fetch-depth: 0

      - name: Apply structural parser patch
        run: python scripts/patch_pdf_metadata_validation.py

      - name: Commit only Python contracts
        run: |
          git config user.name "open-study-path-bot"
          git config user.email "open-study-path-bot@users.noreply.github.com"
          git add scripts/study_slides.py scripts/test_study_slides.py
          git diff --cached --quiet && exit 0
          git commit -m "fix: parse embedded PDF provenance structurally [pdf-parser-scripts]"
          git push origin HEAD:agent/parse-slide-pdf-metadata
