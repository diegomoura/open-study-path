name: Apply publication projection patch

on:
  push:
    branches:
      - agent/publication-contract-audit-final
    paths:
      - '.open-study-path/patch-payload/**'
      - '.github/workflows/apply-publication-patch.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Expand validated patch
        shell: bash
        run: |
          set -euo pipefail
          cat .open-study-path/patch-payload/part-* | tr -d '\n' | base64 --decode > /tmp/open-study-path-patch.tgz
          tar -xzf /tmp/open-study-path-patch.tgz -C .
          rm -rf .open-study-path/patch-payload
          rm -f .github/workflows/apply-publication-patch.yml
      - name: Validate patch before commit
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/task_projection_engine.py scripts/operation_branch.py scripts/render_integration_summary.py scripts/render_project_instructions.py scripts/validate_task_projection.py
          PYTHONPATH=scripts python -m unittest discover -s tests -v
          PYTHONPATH=scripts python scripts/validate_task_projection.py
      - name: Commit expanded patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: make external publication convergent'
          git push origin HEAD:${{ github.ref_name }}
