name: Apply publication projection patch

on:
  pull_request:
    types: [reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/publication-contract-audit-final'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/publication-contract-audit-final
          fetch-depth: 0
      - name: Expand validated patch
        shell: bash
        run: |
          set -euo pipefail
          cp .github/workflows/validate-task-projection.yml /tmp/validate-task-projection.yml
          cat .open-study-path/patch-payload/part-* | tr -d '\n' | base64 --decode > /tmp/open-study-path-patch.tgz
          tar -xzf /tmp/open-study-path-patch.tgz -C .
          cp /tmp/validate-task-projection.yml .github/workflows/validate-task-projection.yml
          rm -rf .open-study-path/patch-payload
      - name: Commit expanded patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: make external publication convergent'
          git push origin HEAD:agent/publication-contract-audit-final
