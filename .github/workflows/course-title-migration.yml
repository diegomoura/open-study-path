name: Migrate course-title intake contract

on:
  push:
    branches:
      - agent/use-course-title

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/use-course-title
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply canonical migration
        run: |
          python - <<'PY'
          from pathlib import Path

          def read(path: str) -> str:
              return Path(path).read_text(encoding="utf-8")

          def write(path: str, content: str) -> None:
              Path(path).write_text(content, encoding="utf-8")

          def replace_once(content: str, old: str, new: str, path: str) -> str:
              if old not in content:
                  raise SystemExit(f"expected text not found in {path}: {old[:80]!r}")
              return content.replace(old, new, 1)

          form_path = ".github/ISSUE_TEMPLATE/create-study-path.yml"
          form = read(form_path)
          form = replace_once(
              form,
              'name: Criar minha trilha de estudos\ndescription: Conte o que você quer aprender e como gostaria de estudar.\ntitle: "[Nova trilha] "\n',
              'name: Criar meu curso\ndescription: Conte o que você quer aprender e como prefere estudar.\n',
              form_path,
          )
          form = replace_once(
              form,
              '''        <!-- open-study-path:intake form_id=create-study-path version=2 -->

        # Vamos criar uma trilha que faça sentido para você

        Responda apenas o que for útil para o planejamento. Você poderá ajustar a trilha depois. Não inclua senhas, documentos sensíveis ou informações pessoais desnecessárias.

        Depois deste formulário, faremos um diagnóstico curto para escolher o melhor ponto de partida.

  - type: input
    id: path_name
    attributes:
      label: Como gostaria de chamar esta trilha?
      description: Opcional. Pode ser algo simples, como “Fundamentos de IA”.

''',
              '''        <!-- open-study-path:intake form_id=create-study-path version=3 -->

        # Vamos criar um curso que faça sentido para você

        ## Dê um nome ao seu curso

        No campo **Add a title** acima, escreva o nome do curso. Esse campo é obrigatório e o nome será usado no roadmap, nas aulas e nas ferramentas conectadas.

        Exemplos: **Fundamentos de IA**, **Engenharia com IA Generativa** ou **Preparação para AWS Solutions Architect**.

        Responda apenas o que for útil para o planejamento. Você poderá ajustar o curso depois. Não inclua senhas, documentos sensíveis ou informações pessoais desnecessárias.

        Depois deste formulário, faremos um diagnóstico curto para escolher o melhor ponto de partida.

''',
              form_path,
          )
          form = form.replace("A trilha pode combinar vários formatos", "O curso pode combinar vários formatos")
          form = form.replace("A trilha deve funcionar somente com opções gratuitas?", "O curso deve funcionar somente com opções gratuitas?")
          form = form.replace("a trilha continuará funcionando no GitHub", "o curso continuará funcionando no GitHub")
          write(form_path, form)

          mapping_path = "intake/field-mapping.yml"
          mapping = read(mapping_path)
          mapping = replace_once(
              mapping,
              "spec_id: open-study-path-intake\n\nmappings:\n",
              '''spec_id: open-study-path-intake

github_issue:
  current_form_version: 3
  current_mappings:
    issue_title: path.name
  compatible_versions:
    2:
      path_name: path.name
      title_prefixes:
        - "[Nova trilha]"
        - "[Study Path]:"

mappings:
''',
              mapping_path,
          )
          write(mapping_path, mapping)

          write("scripts/intake_resolution.py", '''#!/usr/bin/env python3
"""Deterministic GitHub Issue Form intake resolution.

The supported hidden marker is authoritative. Version 3 uses the native GitHub
issue title as the course name. Version 2 and unmarked legacy submissions remain
supported through stricter compatibility signals.
"""

from __future__ import annotations

from dataclasses import dataclass
import re
from typing import Iterable, Sequence

CURRENT_FORM_ID = "create-study-path"
CURRENT_FORM_VERSION = 3
COMPATIBLE_FORM_VERSIONS = frozenset({2})
SUPPORTED_FORM_VERSIONS = frozenset({CURRENT_FORM_VERSION, *COMPATIBLE_FORM_VERSIONS})
CURRENT_MARKER = (
    "<!-- open-study-path:intake "
    f"form_id={CURRENT_FORM_ID} version={CURRENT_FORM_VERSION} -->"
)
VERSION_2_MARKER = (
    "<!-- open-study-path:intake "
    f"form_id={CURRENT_FORM_ID} version=2 -->"
)
LEGACY_CURRENT_PREFIX = "[Nova trilha]"
LEGACY_PREFIX = "[Study Path]:"
DISCOVERY_LABEL = "study-request"
IMPORTED_LABEL = "intake:imported"

ANY_MARKER_RE = re.compile(r"<!--\s*open-study-path:intake\b[^>]*-->", re.IGNORECASE)
INTAKE_MARKER_RE = re.compile(
    r"<!--\s*open-study-path:intake\s+"
    r"form_id=(?P<form_id>[A-Za-z0-9_-]+)\s+"
    r"version=(?P<version>\d+)\s*-->",
    re.IGNORECASE,
)


@dataclass(frozen=True)
class IntakeIssue:
    number: int
    title: str
    body: str
    labels: frozenset[str]
    is_pull_request: bool = False
    source_reference: str | None = None


@dataclass(frozen=True)
class CandidateDecision:
    issue_number: int
    accepted: bool
    mode: str | None
    reasons: tuple[str, ...]
    repairs: tuple[str, ...]


@dataclass(frozen=True)
class Resolution:
    state: str
    accepted: tuple[CandidateDecision, ...]
    rejected: tuple[CandidateDecision, ...]


def _normalized_labels(labels: Iterable[str]) -> set[str]:
    return {label.strip().lower() for label in labels if label.strip()}


def _has_expected_headings(body: str, expected_headings: Sequence[str]) -> bool:
    return bool(expected_headings) and all(heading in body for heading in expected_headings)


def _has_course_title(title: str) -> bool:
    value = title.strip()
    return bool(value) and value not in {LEGACY_CURRENT_PREFIX, LEGACY_PREFIX}


def classify_issue(
    issue: IntakeIssue,
    expected_headings: Sequence[str],
    imported_references: Iterable[str] = (),
) -> CandidateDecision:
    """Classify one issue without selecting it."""

    reasons: list[str] = []
    repairs: list[str] = []
    labels = _normalized_labels(issue.labels)
    imported = {reference for reference in imported_references if reference}

    if issue.is_pull_request:
        reasons.append("pull_request")
    if issue.source_reference and issue.source_reference in imported:
        reasons.append("already_recorded")
    if IMPORTED_LABEL in labels:
        reasons.append("already_labeled_imported")
    if not _has_expected_headings(issue.body, expected_headings):
        reasons.append("missing_expected_headings")

    marker_matches = list(ANY_MARKER_RE.finditer(issue.body))
    detail_matches = list(INTAKE_MARKER_RE.finditer(issue.body))

    if marker_matches:
        if (
            len(marker_matches) != 1
            or len(detail_matches) != 1
            or marker_matches[0].span() != detail_matches[0].span()
        ):
            reasons.append("unsupported_or_ambiguous_marker")
            return CandidateDecision(issue.number, False, None, tuple(reasons), ())

        marker = detail_matches[0]
        form_id = marker.group("form_id")
        version = int(marker.group("version"))
        if form_id != CURRENT_FORM_ID or version not in SUPPORTED_FORM_VERSIONS:
            reasons.append("unsupported_or_ambiguous_marker")
            return CandidateDecision(issue.number, False, None, tuple(reasons), ())
        if version == CURRENT_FORM_VERSION and not _has_course_title(issue.title):
            reasons.append("missing_course_title")
        if reasons:
            return CandidateDecision(issue.number, False, None, tuple(reasons), ())

        if DISCOVERY_LABEL not in labels:
            repairs.append("add_study_request_label")
        mode = "current_marker" if version == CURRENT_FORM_VERSION else "compatible_marker_v2"
        return CandidateDecision(issue.number, True, mode, (), tuple(repairs))

    legacy_title = issue.title.startswith(LEGACY_CURRENT_PREFIX) or issue.title.startswith(LEGACY_PREFIX)
    if DISCOVERY_LABEL not in labels:
        reasons.append("legacy_missing_study_request_label")
    if not legacy_title:
        reasons.append("legacy_unrecognized_title")

    if reasons:
        return CandidateDecision(issue.number, False, None, tuple(reasons), ())
    return CandidateDecision(issue.number, True, "legacy_signals", (), ())


def resolve_candidates(
    issues: Iterable[IntakeIssue],
    expected_headings: Sequence[str],
    imported_references: Iterable[str] = (),
) -> Resolution:
    accepted: list[CandidateDecision] = []
    rejected: list[CandidateDecision] = []

    for issue in issues:
        decision = classify_issue(issue, expected_headings, imported_references)
        (accepted if decision.accepted else rejected).append(decision)

    state = "unique" if len(accepted) == 1 else "none" if not accepted else "ambiguous"
    return Resolution(state, tuple(accepted), tuple(rejected))
''')

          write("scripts/test_intake_resolution.py", '''#!/usr/bin/env python3
"""Behavioral regressions for deterministic intake resolution."""

from __future__ import annotations

from intake_resolution import CURRENT_MARKER, VERSION_2_MARKER, IntakeIssue, resolve_candidates

HEADINGS = (
    "### O que você quer aprender?",
    "### Conte um pouco mais sobre seu objetivo",
    "### Como você descreve seu nível atual?",
)
BODY = "\n\n".join(HEADINGS)


def issue(
    number: int,
    *,
    title: str = "Engenharia de Aplicações com IA Generativa",
    body: str = BODY,
    labels: tuple[str, ...] = ("study-request",),
    is_pull_request: bool = False,
    source_reference: str | None = None,
) -> IntakeIssue:
    return IntakeIssue(
        number=number,
        title=title,
        body=body,
        labels=frozenset(labels),
        is_pull_request=is_pull_request,
        source_reference=source_reference,
    )


def assert_state(expected: str, *issues: IntakeIssue, imported: tuple[str, ...] = ()):
    result = resolve_candidates(issues, HEADINGS, imported)
    if result.state != expected:
        raise SystemExit(f"expected {expected}, got {result.state}: {result}")
    return result


def main() -> None:
    current = issue(1, body=f"{CURRENT_MARKER}\n\n{BODY}", labels=())
    resolved = assert_state("unique", current)
    if resolved.accepted[0].mode != "current_marker":
        raise SystemExit("version 3 issue was not classified as current")
    if set(resolved.accepted[0].repairs) != {"add_study_request_label"}:
        raise SystemExit(f"current candidate repairs changed: {resolved.accepted[0].repairs}")

    missing_title = issue(2, title="", body=f"{CURRENT_MARKER}\n\n{BODY}")
    assert_state("none", missing_title)

    placeholder_title = issue(3, title="[Nova trilha]", body=f"{CURRENT_MARKER}\n\n{BODY}")
    assert_state("none", placeholder_title)

    compatible = issue(
        4,
        title="[Nova trilha] Curso antigo",
        body=f"{VERSION_2_MARKER}\n\n### Como gostaria de chamar esta trilha?\n\n{BODY}",
    )
    compatible_result = assert_state("unique", compatible)
    if compatible_result.accepted[0].mode != "compatible_marker_v2":
        raise SystemExit("version 2 issue was not classified through compatibility mode")

    headings_only = issue(5, title="Curso sem marcador", labels=())
    assert_state("none", headings_only)

    legacy = issue(6, title="[Study Path]: IA")
    legacy_result = assert_state("unique", legacy)
    if legacy_result.accepted[0].mode != "legacy_signals":
        raise SystemExit("legacy issue was not classified through legacy signals")

    unsupported = issue(
        7,
        body="<!-- open-study-path:intake form_id=create-study-path version=99 -->\n\n" + BODY,
    )
    assert_state("none", unsupported)

    imported_label = issue(8, body=f"{CURRENT_MARKER}\n\n{BODY}", labels=("intake:imported",))
    assert_state("none", imported_label)

    pull_request = issue(9, body=f"{CURRENT_MARKER}\n\n{BODY}", is_pull_request=True)
    assert_state("none", pull_request)

    missing_heading = issue(10, body=f"{CURRENT_MARKER}\n\n{HEADINGS[0]}")
    assert_state("none", missing_heading)

    first = issue(11, body=f"{CURRENT_MARKER}\n\n{BODY}")
    second = issue(12, body=f"{CURRENT_MARKER}\n\n{BODY}")
    assert_state("ambiguous", first, second)

    recorded = issue(13, body=f"{CURRENT_MARKER}\n\n{BODY}", source_reference="github_issue:13")
    assert_state("none", recorded, imported=("github_issue:13",))

    explicit_invalid = issue(14, title="manual", labels=())
    assert_state("none", explicit_invalid)

    print("Deterministic intake resolution regressions passed.")


if __name__ == "__main__":
    main()
''')

          write("scripts/validate_intake_resolution.py", '''#!/usr/bin/env python3
"""Validate marker-first intake discovery and course-title semantics."""

from __future__ import annotations

import sys
from pathlib import Path
from typing import Any

import yaml

from intake_resolution import CURRENT_MARKER, VERSION_2_MARKER

ROOT = Path(__file__).resolve().parents[1]
NATURAL_COMMAND = "Preenchi o formulário. Pode continuar."


def fail(message: str) -> None:
    print(f"ERROR: {message}", file=sys.stderr)
    raise SystemExit(1)


def text(path: str) -> str:
    target = ROOT / path
    if not target.is_file():
        fail(f"missing intake-resolution contract: {path}")
    return target.read_text(encoding="utf-8")


def require(path: str, terms: list[str]) -> None:
    content = text(path)
    for term in terms:
        if term not in content:
            fail(f"{path} is missing deterministic-intake term: {term}")


def load_yaml(path: str) -> Any:
    return yaml.safe_load(text(path))


def main() -> None:
    require("instructions/05-configure-intake.md", [
        "https://github.com/OWNER/REPOSITORY/issues/new?template=create-study-path.yml",
        CURRENT_MARKER,
        VERSION_2_MARKER,
        "Add a title",
        "course name",
        "study-request",
        "intake:imported",
        "Do not require an issue number",
        "older forms",
    ])
    require("instructions/10-intake.md", [
        "scripts/intake_resolution.py",
        CURRENT_MARKER,
        VERSION_2_MARKER,
        "issue title",
        "`issue_title`",
        "`path.name`",
        "Do not rewrite the issue title",
        "Matching headings alone",
        "unsupported",
        "exactly one valid candidate",
        "When none remain",
        "more than one remains",
        "never select an arbitrary newest repository issue",
        "state/intake-summary.json.source_reference",
        "intake:imported",
        "instructions/20-diagnostic.md",
    ])
    require("instructions/phase-completion.md", [
        "Return the direct intake link",
        NATURAL_COMMAND,
        "Do not ask for an issue or submission number",
        "multiple valid candidates",
    ])
    require("templates/chatgpt-project-instructions.md", [
        NATURAL_COMMAND,
        "course name comes from the issue title",
        "Ask for an issue number only when multiple valid candidates remain",
        "Internal review, correction, CI, safe merge",
    ])
    require("AGENTS.md", [
        "course name comes from the issue title",
        "legacy submissions",
        "Matching headings alone",
    ])

    issue_form = load_yaml(".github/ISSUE_TEMPLATE/create-study-path.yml")
    if issue_form.get("name") != "Criar meu curso":
        fail("new intake form must use learner-facing course language")
    if issue_form.get("title") not in (None, ""):
        fail("the native issue title must not be prefilled")
    issue_blocks = [block for block in issue_form.get("body", []) if isinstance(block, dict)]
    if any(block.get("id") == "path_name" for block in issue_blocks):
        fail("GitHub Issue Form must not duplicate the course name in path_name")
    markdown = "\n".join(
        str(block.get("attributes", {}).get("value", ""))
        for block in issue_blocks
        if block.get("type") == "markdown"
    )
    if markdown.count(CURRENT_MARKER) != 1:
        fail("intake Issue Form must contain exactly one current hidden marker")
    for term in ["Add a title", "nome do curso", "Esse campo é obrigatório"]:
        if term not in markdown:
            fail(f"intake title guidance is missing: {term}")

    mapping = load_yaml("intake/field-mapping.yml")
    github_issue = mapping.get("github_issue", {})
    if github_issue.get("current_form_version") != 3:
        fail("GitHub intake mapping must identify form version 3")
    if github_issue.get("current_mappings", {}).get("issue_title") != "path.name":
        fail("GitHub issue title must map to path.name")
    compatibility = github_issue.get("compatible_versions", {})
    version_2 = compatibility.get(2) or compatibility.get("2") or {}
    if version_2.get("path_name") != "path.name":
        fail("version 2 path_name compatibility mapping is missing")

    for path in [
        "scripts/intake_resolution.py",
        "scripts/test_intake_resolution.py",
        "scripts/ensure_repository_labels.py",
        "scripts/test_repository_labels.py",
    ]:
        if not (ROOT / path).is_file():
            fail(f"missing intake regression asset: {path}")

    workflow = text(".github/workflows/validate-template.yml")
    for command in [
        "python scripts/test_intake_resolution.py",
        "python scripts/test_repository_labels.py",
    ]:
        if command not in workflow:
            fail(f"validation workflow is missing: {command}")

    manifest = load_yaml("instructions/manifest.yml")
    phases = {
        phase.get("id"): phase
        for phase in manifest.get("phases", [])
        if isinstance(phase, dict)
    }
    intake = phases.get("intake", {})
    if intake.get("allow_explicit_chain_to") != "diagnostic":
        fail("intake phase must allow validated diagnostic chaining")
    if intake.get("stop_after_phase") is not True:
        fail("intake must stop by default when chaining was not requested")

    print("Marker-first intake resolution and course-title semantics passed.")


if __name__ == "__main__":
    main()
''')

          write("instructions/05-configure-intake.md", '''# Configure intake

Run this phase only in an Open Study Path instance. It prepares the selected intake method but does not import responses or generate a curriculum.

Read and apply `instructions/02-setup-execution.md`. Intake configuration is part of the same first-chat setup operation and uses the same allowed diff and merge gate.

## Provider selection

When no provider is configured, let the owner choose:

1. `github_issue` — recommended because the form already exists in the repository;
2. `jotform` — create a form in the connected account;
3. `manual_yaml` — edit `study.config.yml` directly.

Do not silently select Jotform or create external resources without the owner's choice.

## GitHub Issue Form

1. Confirm `.github/ISSUE_TEMPLATE/create-study-path.yml` exists in the target repository. Do not infer absence from repository size or search metadata.
2. Read the exact repository identity from `.open-study-path/instance.yml`.
3. Confirm the form contains the current hidden identity marker:

   `<!-- open-study-path:intake form_id=create-study-path version=3 -->`

4. Confirm the form does not prefill the native issue title and that its first visible instructions explain: use **Add a title** for the course name. GitHub requires that title before submission; the form must not ask for the name a second time.
5. Verify repository labels `study-request` and `intake:imported` exist. Create only missing labels through the GitHub labels API or run **Prepare ChatGPT Project Instructions**, which invokes `scripts/ensure_repository_labels.py`. Read the labels again after provisioning.
6. Configure the GitHub Issue Form as ready with deterministic submission lookup only after the marker, title guidance and both labels are verified.
7. Build the direct URL:

   `https://github.com/OWNER/REPOSITORY/issues/new?template=create-study-path.yml`

8. Return it as a direct clickable link with a human label such as **Preencher meu formulário**.
9. Stop after setup and use the natural command:

   `Preenchi o formulário. Pode continuar.`

The form is inherited reusable infrastructure. Do not edit, recreate or replace it during normal instance setup. Configure only the instance marker and `study.config.yml` unless a verified template defect requires a separate canonical-template fix.

Do not mark setup or intake ready when label existence, title guidance or the current marker cannot be verified. Do not create or submit an issue, import answers, run the diagnostic or generate curriculum during setup. Do not require an issue number.

### Compatibility

Continue accepting older forms, including the supported marker:

`<!-- open-study-path:intake form_id=create-study-path version=2 -->`

Also continue accepting:

- `Enviei o formulário. Localize e importe a única submissão válida.`
- `Enviei o formulário. Localize e importe a única submissão válida. Conclua e valide esta etapa; depois, inicie o diagnóstico proporcional com perguntas curtas, uma por vez.`
- an explicit issue number when supplied or when multiple valid candidates require disambiguation.

Older `intake.submission_strategy: explicit_issue` means deterministic lookup with an optional number, not a burden to copy it every time.

## Jotform

Confirm the app is connected before reading or creating a form. Never request or store an API key.

Reuse an existing exact form for this instance when verified. Otherwise create it from `intake/jotform-form-spec.yml` in the owner's selected workspace. Do not create a test submission.

Persist only safe metadata: provider, setup status, form ID and URL, specification ID/version, creation mode, attachment policy and `persist_raw_submission: false`.

Return the form link and:

`Preenchi o formulário. Pode continuar.`

Stop before reading submissions.

## Manual YAML

Set the manual provider and return the configuration path. Required facts are subject, objective, current level, preferred language and weekly hours. Do not invent them.

Use:

`Preenchi minha configuração. Pode continuar.`

Continue accepting the older technical YAML command as an alias.

## Instance marker

Update setup and intake-provider status in `.open-study-path/instance.yml`. Setup complete means only that the instance and intake method are ready.

Validate the complete setup diff and required checks for the current head. Do not merge or report successful configuration while a required check is failing, pending, cancelled, missing or unreadable.

Complete with `instructions/phase-completion.md`. Return the selected form or configuration path and make the next human action unmistakable.

<!-- Compatibility markers: direct clickable link; explicit_issue; explicit issue number remains accepted; Do not require the owner to copy an issue number; older forms. -->
''')

          write("instructions/10-intake.md", '''# Import intake

Run this phase only in instance mode after intake setup is ready. Use only the configured form or approved manual configuration belonging to the instance.

The natural command `Preenchi o formulário. Pode continuar.` approves importing the single valid unimported submission found by deterministic filtering. It never authorizes choosing an arbitrary newest submission.

Continue accepting older technical intake commands as aliases.

## Jotform

- Fetch the configured form and confirm access.
- Find submissions containing all required planning facts and not already recorded in `state/intake-summary.json.source_reference`.
- Use an explicitly supplied submission ID when verified.
- Import automatically when exactly one valid candidate remains.
- When none remain, return the form link.
- When several remain, list only the concise information needed for the owner to choose.
- Do not combine submissions, select the newest silently or persist raw submissions and uploads.

## GitHub Issue Form

Search only the instance repository. Apply the algorithm in `scripts/intake_resolution.py`; do not replace it with similarity or newest-issue heuristics.

### Current version 3 submissions

A current candidate must satisfy all of these identity and state checks:

- it is an issue, not a pull request;
- its body contains exactly one supported marker: `<!-- open-study-path:intake form_id=create-study-path version=3 -->`;
- its body contains the expected field headings from `.github/ISSUE_TEMPLATE/create-study-path.yml`;
- its issue title contains a non-empty course name;
- it is not already identified by `state/intake-summary.json.source_reference`;
- it does not have the `intake:imported` label.

Treat the trimmed issue title as the synthetic field `issue_title` and map it to `path.name` through `intake/field-mapping.yml`. Preserve the learner's title as the course name. Do not add `[Nova trilha]`, another prefix or a generic suffix. Do not rewrite the issue title during import.

For a uniquely resolved current candidate, the `study-request` label is a repairable consistency signal. Add it when missing only after unique selection.

### Compatible marked version 2 submissions

Continue accepting exactly one supported older marker:

`<!-- open-study-path:intake form_id=create-study-path version=2 -->`

For version 2, use the non-empty `path_name` answer as `path.name`. When that optional answer is empty, remove the known `[Nova trilha]` or `[Study Path]:` prefix from the issue title and use the non-empty remainder. If neither source yields a course name, stop and ask the owner to provide one; do not invent it.

The version 2 title and discovery label remain compatibility signals. Add a missing `study-request` label after unique selection, but do not rewrite the issue title or the learner's answers.

If any `open-study-path:intake` marker is present but its form ID, version, count or syntax is unsupported, reject that issue. Do not reinterpret it as an unmarked legacy submission.

### Legacy unmarked submissions

An issue without an intake marker is a valid legacy candidate only when every legacy identity signal is present together:

- label `study-request`;
- legacy `[Nova trilha]` or `[Study Path]:` title prefix;
- expected form field headings;
- no prior source reference;
- no `intake:imported` label.

Matching headings alone, a unique recent issue, similar answers or an edited title are never sufficient legacy identity. Do not silently weaken the filter because only one issue looks plausible.

An explicit issue number narrows the search but does not bypass current, compatible or legacy identity checks.

### Selection and import

When the form was reported as submitted:

1. classify all candidates using the current-marker, compatible-marker and legacy rules above;
2. import automatically when exactly one valid candidate remains;
3. when none remain, return the direct form link and explain that no verifiable submission was found yet;
4. when more than one remains, list candidate number, title and creation time and ask the owner to choose;
5. never select an arbitrary newest repository issue.

After import, persist the exact source reference, apply `intake:imported` and retain `study-request` for auditability. Treat attachments as optional and do not copy them into the repository by default.

## Manual YAML

Read only learner-approved values in `study.config.yml`. Do not interpret placeholders as confirmed facts.

## Planning facts

Required facts are course name, subject, detailed objective, current level, preferred language and weekly availability. Other schedule, motivation, accessibility, reference and integration answers are optional.

Normalize approved answers through the provider-specific mappings in `intake/field-mapping.yml` into `study.config.yml` and `state/intake-summary.json`. Missing optional answers must not block the course. Record only necessary conservative assumptions.

Do not recommend, connect or probe external tools during intake. Keep delegated provider choices as `auto` until diagnostic and curriculum context exist.

Internal invariants such as GitHub authority, formative-practice limits, Mermaid canonical status, one primary task backend and `github_to_airtable` analytics are normalized without requiring the learner to repeat them. Do not surface those terms in the success response.

Update `.open-study-path/instance.yml` with completed intake status.

## Pull request and merge

Create a PR limited to the instance marker, `study.config.yml` and `state/intake-summary.json`. Apply `workflow.intake_merge_policy`. Auto-merge only when facts, validation, privacy, scope and assumptions are unambiguous.

Technical review belongs in GitHub. In chat, do not report changed files, CI or merge details after success unless requested or needed to explain a blocker.

## Diagnostic continuation

Do not begin diagnostic until import, validation and required merge complete.

When the command authorizes continuing, immediately run `instructions/20-diagnostic.md`, state the small question range and ask the first question.

When import only was requested, use:

`Vamos fazer meu diagnóstico.`

Continue accepting:

`Inicie o diagnóstico proporcional desta trilha. Faça perguntas curtas, uma por vez. Não gere a trilha ainda.`

If no unique candidate exists or a real decision is required, stop and surface only the action that resolves it.

