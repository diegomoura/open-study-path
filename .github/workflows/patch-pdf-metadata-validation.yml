name: Patch PDF metadata validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: pdf-metadata-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout patch branch
        uses: actions/checkout@v4
        with:
          ref: agent/parse-slide-pdf-metadata
          fetch-depth: 0

      - name: Check whether patch is already applied
        id: guard
        run: |
          if git log -1 --pretty=%B | grep -Fq '[pdf-metadata-patched]'; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply structural PDF metadata validation
        if: steps.guard.outputs.run == 'true'
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/validate-template.yml')
          text = workflow.read_text(encoding='utf-8')
          text = text.replace('pyyaml jsonschema\n', 'pyyaml jsonschema pypdf\n')
          workflow.write_text(text, encoding='utf-8')

          validator = Path('scripts/study_slides.py')
          text = validator.read_text(encoding='utf-8')
          if 'from pypdf import PdfReader' not in text:
              text = text.replace('import yaml\n', 'import yaml\nfrom pypdf import PdfReader\n')
          helper_marker = '    return pages, len(data), sha256(data).hexdigest(), data, errors\n\n\ndef _validate_assets'
          helper = '''    return pages, len(data), sha256(data).hexdigest(), data, errors


def pdf_metadata(path: Path) -> tuple[dict[str, str], list[str]]:
    try:
        reader = PdfReader(str(path))
        metadata = reader.metadata or {}
        return {
            "producer": _text(metadata.get("/Producer")),
            "creator": _text(metadata.get("/Creator")),
            "title": _text(metadata.get("/Title")),
            "subject": _text(metadata.get("/Subject")),
        }, []
    except Exception as exc:
        return {}, [f"{path} PDF metadata cannot be read: {exc}"]


def _validate_assets'''
          if 'def pdf_metadata(' not in text:
              if helper_marker not in text:
                  raise SystemExit('pdf_info insertion point not found')
              text = text.replace(helper_marker, helper)

          old = '''    for marker, label in [
        (PDF_PRODUCER.encode("ascii"), "renderer producer"),
        (source_digest.encode("ascii"), "source digest"),
        (snapshot_digest.encode("ascii"), "rendered snapshot digest"),
    ]:
        if marker and marker not in pdf_data:
            errors.append(f"{topic_id} committed PDF is not bound to current HTML ({label} missing)")
    if b"ReportLab Generated PDF" in pdf_data:
        errors.append(f"{topic_id} committed PDF was not produced by the HTML slide renderer")
'''
          new = '''    embedded, embedded_errors = pdf_metadata(pdf_path)
    errors.extend(embedded_errors)
    expected_subject = (
        f"open-study-path-renderer:{RENDERER_ID};"
        f"source:{source_digest};snapshot:{snapshot_digest}"
    )
    if embedded:
        if embedded.get("title") != f"{topic_id} study slides":
            errors.append(f"{topic_id} committed PDF title provenance mismatch")
        if embedded.get("subject") != expected_subject:
            errors.append(f"{topic_id} committed PDF source or rendered-snapshot provenance mismatch")
        if "reportlab" in embedded.get("producer", "").lower():
            errors.append(f"{topic_id} committed PDF was not produced by the HTML slide renderer")
'''
          if old not in text:
              raise SystemExit('raw PDF marker block not found')
          text = text.replace(old, new)
          validator.write_text(text, encoding='utf-8')

          tests = Path('scripts/test_study_slides.py')
          text = tests.read_text(encoding='utf-8')
          if 'from io import BytesIO' not in text:
              text = text.replace('from __future__ import annotations\n\n', 'from __future__ import annotations\n\nfrom io import BytesIO\n')
          if 'from pypdf import PdfWriter' not in text:
              text = text.replace('import yaml\n', 'import yaml\nfrom pypdf import PdfWriter\n')
          start = text.index('def fake_pdf(')
          end = text.index('\n\ndef build_valid_tree', start)
          fake = '''def fake_pdf(pages: int, source_digest: str, snapshot_digest: str, *, reportlab: bool = False) -> bytes:
    stream = BytesIO()
    writer = PdfWriter()
    for _ in range(pages):
        writer.add_blank_page(width=1280, height=720)
    producer = "ReportLab Generated PDF document" if reportlab else PDF_PRODUCER
    writer.add_metadata({
        "/Producer": producer,
        "/Creator": producer,
        "/Title": "TOPIC-001 study slides",
        "/Subject": (
            f"open-study-path-renderer:{RENDERER_ID};"
            f"source:{source_digest};snapshot:{snapshot_digest}"
        ),
        "/Keywords": "x" * 25000,
    })
    writer.write(stream)
    return stream.getvalue()
'''
          text = text[:start] + fake + text[end:]
          text = text.replace(
              '        assert any("not produced by the HTML slide renderer" in error for error in errors)\n'
              '        assert any("renderer producer missing" in error for error in errors)\n',
              '        assert any("not produced by the HTML slide renderer" in error for error in errors)\n',
          )
          tests.write_text(text, encoding='utf-8')
          PY

      - name: Commit parser-backed validation
        if: steps.guard.outputs.run == 'true'
        run: |
          git config user.name "open-study-path-bot"
          git config user.email "open-study-path-bot@users.noreply.github.com"
          git add .github/workflows/validate-template.yml scripts/study_slides.py scripts/test_study_slides.py
          git commit -m "fix: parse embedded PDF provenance structurally [pdf-metadata-patched]"
          git push origin HEAD:agent/parse-slide-pdf-metadata
