name: Criar trilha de estudos
description: Onboarding zero-config para uma instância do Open Study Path
title: "[Study Path]: "
labels: ["study-request"]
body:
  - type: markdown
    attributes:
      value: |
        Use este formulário somente em um fork ou repositório criado a partir do template.
        Informe apenas dados necessários ao planejamento. Não inclua segredos ou dados pessoais desnecessários.
        Campos e anexos indicados como opcionais não bloqueiam a geração da trilha.

  - type: input
    id: path_name
    attributes:
      label: Nome da trilha
      description: Opcional.

  - type: input
    id: subject
    attributes:
      label: O que você quer aprender?
      placeholder: "Exemplo: engenharia de aplicações com IA"
    validations:
      required: true

  - type: textarea
    id: objective
    attributes:
      label: Descreva detalhadamente seu objetivo
      description: Inclua escopo, contexto e assuntos que deseja incluir ou excluir.
    validations:
      required: true

  - type: textarea
    id: desired_outcome
    attributes:
      label: Qual resultado concreto gostaria de alcançar?
      description: Opcional.

  - type: textarea
    id: motivation
    attributes:
      label: Por que deseja estudar isso?
      description: Opcional.

  - type: dropdown
    id: current_level
    attributes:
      label: Qual é seu nível atual?
      options:
        - Nenhum conhecimento
        - Iniciante
        - Intermediário
        - Avançado
    validations:
      required: true

  - type: textarea
    id: prior_knowledge
    attributes:
      label: Conhecimentos e experiências anteriores
      description: Opcional. Liste apenas o que for relevante para esta trilha.

  - type: textarea
    id: references
    attributes:
      label: Textos, URLs ou anexos de referência
      description: Opcional. Cole textos e URLs ou arraste arquivos para este campo. Não anexe arquivos sensíveis.

  - type: input
    id: preferred_language
    attributes:
      label: Em qual idioma deseja receber o conteúdo?
      value: pt-BR
    validations:
      required: true

  - type: input
    id: weekly_hours
    attributes:
      label: Quantas horas por semana você possui?
      placeholder: "6"
      description: Informe um número positivo.
    validations:
      required: true

  - type: input
    id: deadline
    attributes:
      label: Existe uma data limite?
      placeholder: YYYY-MM-DD
      description: Opcional.

  - type: checkboxes
    id: preferred_days
    attributes:
      label: Quais dias prefere estudar?
      description: Opcional.
      options:
        - label: Segunda-feira
        - label: Terça-feira
        - label: Quarta-feira
        - label: Quinta-feira
        - label: Sexta-feira
        - label: Sábado
        - label: Domingo

  - type: checkboxes
    id: preferred_periods
    attributes:
      label: Quais períodos prefere?
      description: Opcional.
      options:
        - label: Manhã
        - label: Tarde
        - label: Noite

  - type: checkboxes
    id: learning_formats
    attributes:
      label: Quais formatos de aprendizagem prefere?
      description: Opcional.
      options:
        - label: Documentação
        - label: Livros
        - label: Vídeos
        - label: Cursos
        - label: Exercícios
        - label: Projetos
        - label: Discussões
        - label: Flashcards

  - type: dropdown
    id: theory_practice_balance
    attributes:
      label: Qual equilíbrio prefere entre teoria e prática?
      description: Opcional.
      options:
        - Mais teoria
        - Equilibrado
        - Mais prática

  - type: checkboxes
    id: assessment_style
    attributes:
      label: Como prefere ser avaliado?
      description: Opcional.
      options:
        - label: Quizzes
        - label: Exercícios
        - label: Explicação escrita
        - label: Projeto
        - label: Entrevista simulada

  - type: textarea
    id: accessibility_needs
    attributes:
      label: Necessidades de acessibilidade ou restrições
      description: Opcional.

  - type: dropdown
    id: task_manager
    attributes:
      label: Onde deseja acompanhar as tarefas?
      options:
        - GitHub Issues
        - Trello
        - Somente Markdown
    validations:
      required: true

  - type: dropdown
    id: use_calendar
    attributes:
      label: Deseja integrar com Google Calendar?
      description: Opcional.
      options:
        - Não
        - Sim

  - type: dropdown
    id: email_summaries
    attributes:
      label: Deseja receber resumos pelo Gmail?
      description: Opcional. Se escolher Sim, a integração de notificações será configurada como Gmail.
      options:
        - Não
        - Sim

  - type: textarea
    id: additional_notes
    attributes:
      label: Observações adicionais
      description: Opcional.

  - type: checkboxes
    id: consent
    attributes:
      label: Consentimento
      options:
        - label: Entendo que informações normalizadas necessárias ao planejamento poderão ser salvas neste repositório, sem persistir a submissão bruta, anexos originais ou dados pessoais desnecessários.
          required: true