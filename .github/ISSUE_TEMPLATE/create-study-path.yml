name: Create a study path in this instance
description: Fallback onboarding form for a fork or repository created from Open Study Path
title: "[Study Path]: "
labels: ["study-request"]
body:
  - type: markdown
    attributes:
      value: |
        Use this form only in your own fork or derived repository. Do not submit learner data to the canonical template repository.

        Provide only information needed to generate your learning path. Do not include secrets or unnecessary personal data. Reference files are optional.
  - type: input
    id: subject
    attributes:
      label: What do you want to learn?
    validations:
      required: true
  - type: textarea
    id: objective
    attributes:
      label: What is your detailed objective?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: What concrete result do you expect? (optional)
      description: Leave blank when the objective already provides enough context.
  - type: textarea
    id: motivation
    attributes:
      label: Why do you want to study this? (optional)
  - type: dropdown
    id: level
    attributes:
      label: Current level
      options:
        - No knowledge
        - Beginner
        - Intermediate
        - Advanced
    validations:
      required: true
  - type: input
    id: language
    attributes:
      label: Preferred content language
      placeholder: pt-BR
    validations:
      required: true
  - type: input
    id: weekly_hours
    attributes:
      label: Available hours per week
      placeholder: "5"
    validations:
      required: true
  - type: input
    id: deadline
    attributes:
      label: Optional deadline
      placeholder: YYYY-MM-DD
  - type: textarea
    id: prior_knowledge
    attributes:
      label: Prior knowledge and experience (optional)
  - type: textarea
    id: references
    attributes:
      label: Reference text, URLs or optional file attachments
      description: Paste text or links here. GitHub also lets you drag optional files into this field. Do not attach secrets or unnecessary personal data.
  - type: dropdown
    id: task_manager
    attributes:
      label: Task manager
      options:
        - GitHub Issues
        - Trello
        - Markdown only
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Additional notes (optional)
  - type: checkboxes
    id: consent
    attributes:
      label: Consent
      options:
        - label: I understand that normalized planning data may be saved in this repository, without raw submissions, uploaded files or unnecessary personal data.
          required: true