name: Criar minha trilha de estudos
description: Conte o que você quer aprender e como gostaria de estudar.
title: "[Nova trilha] "
labels: ["study-request"]
body:
  - type: markdown
    attributes:
      value: |
        # Vamos criar uma trilha que faça sentido para você

        Responda apenas o que for útil para o planejamento. Você poderá ajustar a trilha depois. Não inclua senhas, documentos sensíveis ou informações pessoais desnecessárias.

        Depois deste formulário, faremos um diagnóstico curto para escolher o melhor ponto de partida.

  - type: input
    id: path_name
    attributes:
      label: Como gostaria de chamar esta trilha?
      description: Opcional. Pode ser algo simples, como “Fundamentos de IA”.

  - type: input
    id: subject
    attributes:
      label: O que você quer aprender?
      placeholder: "Exemplo: criar aplicações com inteligência artificial"
    validations:
      required: true

  - type: textarea
    id: objective
    attributes:
      label: Conte um pouco mais sobre seu objetivo
      description: Inclua assuntos importantes, contexto de uso e algo que prefere deixar de fora.
      placeholder: "Quero aprender para..."
    validations:
      required: true

  - type: textarea
    id: desired_outcome
    attributes:
      label: O que você gostaria de conseguir fazer ao final?
      description: Opcional. Pense em um resultado observável, projeto ou decisão que gostaria de realizar melhor.

  - type: textarea
    id: motivation
    attributes:
      label: Por que isso é importante para você agora?
      description: Opcional. Essa resposta ajuda a tornar exemplos e prioridades mais relevantes.

  - type: dropdown
    id: current_level
    attributes:
      label: Como você descreve seu nível atual?
      options:
        - Nenhum conhecimento
        - Iniciante
        - Intermediário
        - Avançado
    validations:
      required: true

  - type: textarea
    id: prior_knowledge
    attributes:
      label: O que você já conhece ou já tentou?
      description: Opcional. Liste somente experiências relacionadas a esta trilha.

  - type: textarea
    id: references
    attributes:
      label: Existe algum material que você gostaria que fosse considerado?
      description: Opcional. Cole textos e links ou anexe arquivos não sensíveis. As fontes serão verificadas antes de entrar nas aulas.

  - type: input
    id: preferred_language
    attributes:
      label: Em qual idioma prefere estudar?
      value: pt-BR
    validations:
      required: true

  - type: input
    id: weekly_hours
    attributes:
      label: Quanto tempo por semana você consegue reservar?
      placeholder: "2"
      description: Informe um número aproximado de horas.
    validations:
      required: true

  - type: input
    id: deadline
    attributes:
      label: Existe uma data importante?
      placeholder: YYYY-MM-DD
      description: Opcional.

  - type: checkboxes
    id: preferred_days
    attributes:
      label: Em quais dias costuma ser mais fácil estudar?
      description: Opcional.
      options:
        - label: Segunda-feira
        - label: Terça-feira
        - label: Quarta-feira
        - label: Quinta-feira
        - label: Sexta-feira
        - label: Sábado
        - label: Domingo

  - type: checkboxes
    id: preferred_periods
    attributes:
      label: Qual período costuma funcionar melhor?
      description: Opcional.
      options:
        - label: Manhã
        - label: Tarde
        - label: Noite

  - type: checkboxes
    id: learning_formats
    attributes:
      label: Quais formas de aprender ajudam mais você?
      description: Opcional. A trilha pode combinar vários formatos quando isso realmente ajudar.
      options:
        - label: Explicações escritas e documentação
        - label: Livros e textos longos
        - label: Vídeos e aulas abertas
        - label: Cursos estruturados
        - label: Exercícios práticos
        - label: Projetos
        - label: Discussões e perguntas
        - label: Flashcards

  - type: dropdown
    id: theory_practice_balance
    attributes:
      label: Como prefere equilibrar explicação e prática?
      description: Opcional.
      options:
        - Mais teoria
        - Equilibrado
        - Mais prática

  - type: checkboxes
    id: assessment_style
    attributes:
      label: Como prefere mostrar o que aprendeu?
      description: Opcional. As atividades escolhidas serão adaptadas ao conteúdo.
      options:
        - label: Quizzes
        - label: Exercícios
        - label: Explicação escrita
        - label: Projeto
        - label: Entrevista simulada

  - type: textarea
    id: accessibility_needs
    attributes:
      label: Existe alguma necessidade de acessibilidade ou restrição que devemos considerar?
      description: Opcional.

  - type: markdown
    attributes:
      value: |
        ## Ferramentas opcionais

        Algumas ferramentas podem deixar o acompanhamento, a prática ou a agenda mais convenientes. Elas só serão sugeridas quando houver um benefício concreto, e a trilha continuará funcionando no GitHub quando você não quiser conectá-las.

  - type: dropdown
    id: integration_experience
    attributes:
      label: Como você prefere organizar a experiência?
      description: Você poderá mudar de ideia depois.
      options:
        - Quero sugestões de ferramentas quando forem úteis
        - Quero algo simples, principalmente no GitHub
        - Quero uma experiência mais interativa com ferramentas externas
    validations:
      required: true

  - type: dropdown
    id: free_tier_only
    attributes:
      label: A trilha deve funcionar somente com opções gratuitas?
      description: Mesmo escolhendo “Não”, nenhum recurso pago será o único caminho para estudar.
      options:
        - Sim
        - Não
    validations:
      required: true

  - type: dropdown
    id: account_connections
    attributes:
      label: Quando uma ferramenta puder ajudar, o que devemos fazer?
      options:
        - Perguntar antes de sugerir ou conectar cada serviço
        - Usar somente ferramentas que eu já conectei
        - Manter tudo sem contas externas
    validations:
      required: true

  - type: checkboxes
    id: already_uses
    attributes:
      label: Quais ferramentas você já usa?
      description: Opcional. Marcar aqui não conecta automaticamente nenhuma conta.
      options:
        - label: Trello — quadro visual com etapas e checklists
        - label: Todoist — tarefas e lembretes simples
        - label: Google Calendar — horários fixos de estudo
        - label: Outlook Calendar — agenda Microsoft
        - label: Reclaim — agenda que reorganiza blocos de foco
        - label: Quizlet — flashcards interativos
        - label: Consensus — busca de estudos e artigos científicos
        - label: Habitify — acompanhamento de hábitos
        - label: Whimsical — mapas e diagramas interativos
        - label: Google Drive — documentos, planilhas e apresentações
        - label: Airtable — painéis e organização de dados
        - label: Notion — notas ou biblioteca auxiliar

  - type: checkboxes
    id: willing_to_connect
    attributes:
      label: O que você aceitaria conectar se houver um bom motivo?
      description: Opcional. Você verá a sugestão e decidirá antes de qualquer conexão.
      options:
        - label: Ferramenta de tarefas, como Trello ou Todoist
        - label: Agenda, como Reclaim, Google ou Outlook
        - label: Flashcards, como Quizlet
        - label: Pesquisa acadêmica, como Consensus
        - label: Hábitos, como Habitify
        - label: Diagramas externos, como Whimsical
        - label: Arquivos e entregáveis, como Google Drive
        - label: Painel analítico, como Airtable
        - label: Cursos e aulas externas, como Coursera, edX, Udemy ou Khan Academy

  - type: dropdown
    id: task_manager
    attributes:
      label: Onde gostaria de acompanhar suas etapas?
      description: Trello oferece uma visão mais rica; Todoist é mais simples. Também é possível manter tudo no GitHub.
      options:
        - Deixar o agente recomendar
        - Trello
        - Todoist
        - GitHub Issues
        - Somente Markdown
    validations:
      required: true

  - type: dropdown
    id: scheduling_provider
    attributes:
      label: Gostaria de reservar horários de estudo em alguma agenda?
      description: Reclaim ajuda quando a rotina varia; Google ou Outlook criam blocos fixos.
      options:
        - Deixar o agente recomendar
        - Reclaim
        - Google Calendar
        - Outlook Calendar
        - Sem integração de agenda
    validations:
      required: true

  - type: dropdown
    id: todoist_reminders
    attributes:
      label: Gostaria de considerar lembretes recorrentes no Todoist?
      description: Opcional.
      options:
        - Deixar o agente recomendar
        - Sim
        - Não

  - type: dropdown
    id: email_summaries
    attributes:
      label: Gostaria de receber algum resumo por e-mail?
      description: Opcional. O chat continuará mostrando as informações principais.
      options:
        - Não
        - Gmail
        - Outlook

  - type: textarea
    id: integration_notes
    attributes:
      label: Alguma preferência ou limite sobre ferramentas externas?
      description: Opcional. Informe serviços que deseja evitar, limites de privacidade ou regras do ambiente de trabalho.

  - type: textarea
    id: additional_notes
    attributes:
      label: Há mais alguma coisa que devemos considerar?
      description: Opcional.

  - type: checkboxes
    id: consent
    attributes:
      label: Antes de enviar
      options:
        - label: Entendo que apenas informações necessárias ao planejamento poderão ser organizadas no meu repositório, sem salvar a submissão bruta, credenciais ou dados pessoais desnecessários.
          required: true
